[project]
name = "jcutils"
version = "0.9.0"
description = "python utils"
authors = [{ name = "lijc210", email = "lijc210@163.com" }]
readme = "README.md"
requires-python = ">= 3.10"
homepage = "https://github.com/lijic210/jcutils"
repository = "https://github.com/lijic210/jcutils"
documentation = "https://github.com/lijic210/jcutils"
keywords = ["utils", "toolkit", "tools", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = { text = "MIT License" }

dependencies = [
    "python-dotenv",
    "pydantic",
    "python-dateutil"
]

[project.optional-dependencies]

# 包含所有可选依赖
all = [
    "nacos-sdk-python>=2.0.11",
    "pyapollo-zenkilan>=0.2.0",
    "etcd3gw>=2.5.0",
    "aetcd>=1.0.0",
    "python-consul2>=0.1.5",
    "httpx",
    "requests",
    "retry>=0.9.2",
    "PyMySQL",
    "aiomysql>=0.2.0",
    "DBUtils>=3.0.2",
    # postgres相关
    # psycopg在macOS M 芯片的依赖
    # brew install libpq
    # yum install postgresql-devel
    # dnf install libpq-devel
    # apt-get install libpq-dev
    "psycopg[pool]",
    "asyncpg>=0.30.0",
    "DBUtils>=3.0.2",
    # sql server
    # pymssql 在macOS M 芯片的依赖
    # brew install freetds
    # brew install openssl
    "pymssql",
    "DBUtils>=3.0.2",
    "redis>=3.5.3",
    "kafka-python",
    "pyarrow>=12.0.0",
    "pyhdfs>=0.1.1",
    "clickhouse-driver",
    "clickhouse_connect",
    "pyodps>=0.11.6.1; python_version < '3.9'",
    "pyodps; python_version >= '3.9'",
    "alibabacloud-maxcompute20220104>=2.3.0",
    "alibabacloud_ecs20140526>=3.0.12",
    "alibabacloud_dataworks_public20200518>=4.7.2",
    "huaweicloudsdkdli",
    "esdk-obs-python>=3.23.9.1",
    "retry>=0.9.2",
    "numpy>=1.21,<2; python_version < '3.9'",
    "numpy>=2; python_version >= '3.9'",
    "elasticsearch>=8.10.0",
]

[project.scripts]
jcutils = "jcutils:main"

[project.urls]
Homepage = "https://github.com/lijc210/jcutils"
Documentation = "https://github.com/lijic210/jcutils"
Source = "https://github.com/lijic210/jcutils"
Tracker = "https://github.com/lijc210/jcutils/issues"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

managed = true
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["requests>=2.32.3"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.maturin]
module-name = "jcutils._core"
python-packages = ["jcutils"]
python-source = "src"
