[project]
name = "jcutils"
version = "0.8.8"
description = "python utils"
authors = [{ name = "lijc210", email = "lijc210@163.com" }]
readme = "README.md"
requires-python = ">= 3.10"
homepage = "https://github.com/lijic210/jcutils"
repository = "https://github.com/lijic210/jcutils"
documentation = "https://github.com/lijic210/jcutils"
keywords = ["utils", "toolkit", "tools", "python"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = { text = "MIT License" }

dependencies = [
    "python-dotenv",
    "pydantic",
    "python-dateutil",
    "retry>=0.9.2",
]

[project.optional-dependencies]
# config相关
config = [
    "nacos-sdk-python>=2.0.11",
    "pyapollo-zenkilan>=0.2.0",
    "etcd3gw>=2.5.0",
    "aetcd>=1.0.0",
    "requests",
    "httpx"
]

# mysql相关
mysql = [
    "PyMySQL",
    "aiomysql>=0.2.0",
    "DBUtils>=3.0.2",
]

# postgres相关
# psycopg在macOS M 芯片的依赖
# brew install libpq
# yum install postgresql-devel
# dnf install libpq-devel
# apt-get install libpq-dev
postgresql = [
    "psycopg[pool]",
    "asyncpg>=0.30.0",
    "DBUtils>=3.0.2",
]

# sql server
# pymssql 在macOS M 芯片的依赖
# brew install freetds
# brew install openssl
pymssql = [
    "pymssql",
    "DBUtils>=3.0.2",
]


# Redis 相关
redis = [
    "redis>=3.5.3"]

# Kafka 相关
kafka = [
    "kafka-python",
]

# hdfs
hdfs = [
    "pyarrow>=12.0.0",
    "pyhdfs>=0.1.1",
]

# clickhouse
clickhouse = [
    "clickhouse-driver",
    "clickhouse_connect"
]

# 阿里云
alibabacloud = [
    "pyodps>=0.11.6.1; python_version < '3.9'",
    "pyodps; python_version >= '3.9'",
    "alibabacloud-maxcompute20220104>=2.3.0",
    "alibabacloud_ecs20140526>=3.0.12",
    "alibabacloud_dataworks_public20200518>=4.7.2",
]

# 华为云
huaweicloud = [
    "huaweicloudsdkdli",
    "esdk-obs-python>=3.23.9.1",
]

# sentry
sentry = [
    "retry>=0.9.2",
]

# data
numpy = [
    "numpy>=1.21,<2; python_version < '3.9'",
    "numpy>=2; python_version >= '3.9'",
]

# elasticsearch
elasticsearch = [
    "elasticsearch>=8.10.0",
]

# 包含所有可选依赖
all = [
    "jcutils[config,mysql,postgresql,pymssql,redis,kafka,clickhouse,alibabacloud,huaweicloud,sentry,numpy,elasticsearch]",
]

[project.scripts]
jcutils = "jcutils:main"

[project.urls]
Homepage = "https://github.com/lijc210/jcutils"
Documentation = "https://github.com/lijic210/jcutils"
Source = "https://github.com/lijic210/jcutils"
Tracker = "https://github.com/lijc210/jcutils/issues"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

managed = true
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["requests>=2.32.3"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.maturin]
module-name = "jcutils._core"
python-packages = ["jcutils"]
python-source = "src"
