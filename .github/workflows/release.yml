name: 🚀 发布到 PyPI
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，用于生成 changelog
      # macOS 必须用非 free-threaded 解释器：runner 默认的 free-threaded Python 会产出
      # abi3t wheel，与 build-free-threaded 的产物同名，artifact 合并时会损坏文件。
      # 版本不影响 abi3 标签，wheel 仍是 cp310-abi3（由 pyo3 的 abi3-py310 决定）
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Verify non-free-threaded Python
        if: runner.os == 'macOS'
        run: |
          python --version --version
          python -c "import sysconfig; assert not sysconfig.get_config_var('Py_GIL_DISABLED'), '需要非 free-threaded 解释器'"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Verify wheel archives
        run: python scripts/verify_wheels.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-free-threaded:
    strategy:
      matrix:
        include:
          # abi3t 前向兼容 wheel (PEP 803)，一个 wheel 覆盖所有 free-threaded Python 3.15+
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            interpreter: /opt/python/cp315-cp315t/bin/python3.15
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            interpreter: /opt/python/cp315-cp315t/bin/python3.15
          - os: macos-latest
            target: aarch64
            manylinux: off
            interpreter: python
          - os: macos-latest
            target: x86_64
            manylinux: off
            interpreter: python
          - os: windows-latest
            target: x86_64
            manylinux: off
            interpreter: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up free-threaded Python 3.15
        if: ${{ matrix.manylinux == 'off' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          freethreaded: true
          allow-prereleases: true
      - name: Verify free-threaded Python
        if: ${{ matrix.manylinux == 'off' }}
        run: |
          python --version --version
          python -c "import sys; print('GIL enabled:', sys._is_gil_enabled())"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.interpreter }}
          manylinux: ${{ matrix.manylinux }}
      - name: Verify wheel archives
        run: python scripts/verify_wheels.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-freethreaded-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-free-threaded-314:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            interpreter: /opt/python/cp314-cp314t/bin/python3.14

          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            interpreter: /opt/python/cp314-cp314t/bin/python3.14

          - os: macos-latest
            target: aarch64
            manylinux: off
            interpreter: python

          - os: macos-latest
            target: x86_64
            manylinux: off
            interpreter: python

          - os: windows-latest
            target: x86_64
            manylinux: off
            interpreter: python

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up free-threaded Python 3.14
        if: ${{ matrix.manylinux == 'off' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          freethreaded: true

      - name: Verify free-threaded Python
        if: ${{ matrix.manylinux == 'off' }}
        run: |
          python --version --version
          python -c "import sys; print('GIL enabled:', sys._is_gil_enabled())"

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.interpreter }}
          manylinux: ${{ matrix.manylinux }}

      - name: Verify wheel archives
        run: python scripts/verify_wheels.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-freethreaded-314-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish:
    needs: [build, build-free-threaded, build-free-threaded-314]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          CURR_TAG=${{ github.ref_name }}
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          if [ -z "$PREV_TAG" ]; then
            # 没有上一个 tag，取所有 commit
            LOG=$(git log --pretty=format:"- %s (%h)" $CURR_TAG)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..$CURR_TAG)
          fi

          # 写入文件，避免特殊字符问题
          echo "$LOG" > changelog.txt
          cat changelog.txt

      # 不用 merge-multiple：同名 wheel 会被静默覆盖且不截断，产生 trailing data
      # 参见 actions/download-artifact#298 与 pypi/warehouse#19746
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: artifacts

      - name: Collect wheels
        run: |
          python - <<'PY'
          import shutil
          import sys
          from collections import Counter
          from pathlib import Path

          sources = sorted(Path("artifacts").rglob("*.whl"))
          duplicates = [name for name, count in Counter(p.name for p in sources).items() if count > 1]
          if duplicates:
              print("检测到重复的 wheel 文件名，合并会静默损坏文件：")
              for name in sorted(duplicates):
                  print(" -", name)
              sys.exit(1)

          dist = Path("dist")
          dist.mkdir(parents=True, exist_ok=True)
          for src in sources:
              shutil.copy2(src, dist / src.name)
          print(f"已收集 {len(sources)} 个 wheel 到 dist/")
          PY

      - name: Verify wheel archives
        run: python scripts/verify_wheels.py dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.txt # 用文件内容作为 release 描述
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'dev') }} # dev tag 标记为预发布

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Upload to TestPyPI (dev)
        if: contains(github.ref_name, 'dev')
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/jcutils/ \
            --token ${{ secrets.TEST_PYPI_TOKEN }} \
            dist/*

      - name: Upload to PyPI (release)
        if: ${{ !contains(github.ref_name, 'dev') }}
        run: |
          uv publish \
            --check-url https://pypi.org/simple/jcutils/ \
            --token ${{ secrets.PYPI_TOKEN }} \
            dist/*
