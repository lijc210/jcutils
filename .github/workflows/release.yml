name: 🚀 发布到 PyPI
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，用于生成 changelog
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  build-free-threaded:
    strategy:
      matrix:
        include:
          # abi3t 前向兼容 wheel (PEP 803)，一个 wheel 覆盖所有 free-threaded Python 3.15+
          - os: ubuntu-latest
            target: x86_64
            manylinux: '2_28'
            interpreter: /opt/python/cp315-cp315t/bin/python3.15
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2_28'
            interpreter: /opt/python/cp315-cp315t/bin/python3.15
          - os: macos-latest
            target: aarch64
            manylinux: off
            interpreter: python
          - os: windows-latest
            target: x86_64
            manylinux: off
            interpreter: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up free-threaded Python 3.15
        if: ${{ matrix.manylinux == 'off' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          freethreaded: true
          allow-prereleases: true
      - name: Verify free-threaded Python
        if: ${{ matrix.manylinux == 'off' }}
        run: |
          python --version --version
          python -c "import sys; print('GIL enabled:', sys._is_gil_enabled())"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ matrix.interpreter }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-freethreaded-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish:
    needs: [build, build-free-threaded]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          CURR_TAG=${{ github.ref_name }}
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          if [ -z "$PREV_TAG" ]; then
            # 没有上一个 tag，取所有 commit
            LOG=$(git log --pretty=format:"- %s (%h)" $CURR_TAG)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..$CURR_TAG)
          fi

          # 写入文件，避免特殊字符问题
          echo "$LOG" > changelog.txt
          cat changelog.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.txt # 用文件内容作为 release 描述
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'dev') }} # dev tag 标记为预发布

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Upload to TestPyPI (dev)
        if: contains(github.ref_name, 'dev')
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://pypi.org/simple/ --token ${{ secrets.TEST_PYPI_TOKEN }} dist/*

      - name: Upload to PyPI (release)
        if: ${{ !contains(github.ref_name, 'dev') }}
        run: uv publish --check-url https://pypi.org/simple/ --token ${{ secrets.PYPI_TOKEN }} dist/*
