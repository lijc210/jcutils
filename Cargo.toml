[package]
name = "jcutils"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]
# crate-type = ["lib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py310" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.10
# Note: abi3 is ignored when building for free-threaded Python (3.13t+),
# a version-specific wheel (e.g. cp313t) will be built instead.
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
chrono = "0.4"
