[package]
name = "jcutils"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]
# crate-type = ["lib"]

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py310" builds using the stable ABI with minimum Python version 3.10 (non-free-threaded)
# "abi3t-py315" builds using the free-threaded stable ABI (PEP 803) with minimum Python version 3.15
# When building with free-threaded Python 3.14t, abi3t falls back to version-specific (cp314-cp314t)
# When building with free-threaded Python 3.15t+, abi3t produces forward-compatible abi3t wheels
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310", "abi3t-py315"] }
chrono = "0.4"
